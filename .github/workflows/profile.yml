name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - assets/src/**
      - .github/workflows/profile.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r assets/src/requirements.txt
      # if the GitHub API fails, the job stops here and the last cards stay
      - name: Fetch stats and draw the cards
        run: python assets/src/build.py --fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # leftovers of the previous design; a no-op once they are gone
      - name: Remove old generated images
        run: git rm -r -q --ignore-unmatch profile-3d-contrib profile
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A assets
          if git commit -m "update profile cards"; then
            git push
          fi
