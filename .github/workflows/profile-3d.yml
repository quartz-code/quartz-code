name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/profile-3d.json
      - .github/workflows/profile-3d.yml

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    env:
      STATS_OPTIONS: username=${{ github.repository_owner }}&locale=ru&custom_title=%D0%A1%D1%82%D0%B0%D1%82%D0%B8%D1%81%D1%82%D0%B8%D0%BA%D0%B0%20GitHub&show_icons=true&rank_icon=github&include_all_commits=true&hide=contribs&show=prs_merged&card_width=495&border_radius=14

    steps:
      - uses: actions/checkout@v5
      # only the images listed in .github/profile-3d.json are kept
      - name: Remove previous images
        run: rm -f profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json
      # The stats card is built here instead of being linked from the public
      # github-readme-stats instance, which is unreliable. If fetching fails,
      # the step fails without writing, so the last good card stays in place.
      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&bg_color=135,1c1132,120b22&title_color=ff6fae&icon_color=c084fc&text_color=d9d0ee&ring_color=ff6fae&border_color=2a2340
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&bg_color=135,fff7fb,f3ecff&title_color=d6336c&icon_color=8b5cf6&text_color=4f4566&ring_color=e83e8c&border_color=ebe1fa
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated 3D contrib"; then
            git push
          fi
